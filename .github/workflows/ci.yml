name: Word Arena CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/controllers/roomController.js
      - run: node --check src/routes/roomRoutes.js
      - run: node --check src/services/gameService.js
      - run: node --check src/services/roomService.js
      - run: node --check src/services/validationService.js
      - run: node --check src/sockets/gameSocket.js
      - run: node --check src/utils/generateRoomId.js
